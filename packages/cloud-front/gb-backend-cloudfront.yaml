---
Mappings:
  # AWSマネージドポリシーID
  # このIDはすべてのアカウント、リージョンで共通であるため、マッピングに定義して参照する
  AWSManagedPolicyIds:
    CachePolicy:
      CACHING_DISABLED: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
    OriginRequestPolicy:
      ALL_VIEWER_EXCEPT_HOST_HEADER: "b689b0a8-53d0-40ab-baf2-68738e2966ac"
Parameters:
  ApiDomainName:
    Type: String
  DistributionAlias:
    Type: String
  AcmCertificateArn:
    Type: String
  WebACLArn:
    Type: String
Resources:
  CloudFrontDistribution:
    UpdateReplacePolicy: "Retain"
    Type: "AWS::CloudFront::Distribution"
    DeletionPolicy: "Delete"
    Properties:
      DistributionConfig:
        Logging:
          IncludeCookies: false
          Bucket: ""
          Prefix: ""
        Comment: "GB Web RTC Helper (dev)"
        DefaultRootObject: ""
        Origins:
          - ConnectionTimeout: 10
            OriginAccessControlId: ""
            ConnectionAttempts: 3
            OriginCustomHeaders: []
            DomainName: !Ref ApiDomainName
            OriginShield:
              Enabled: false
            OriginPath: ""
            Id: !Ref ApiDomainName
            CustomOriginConfig:
              IpAddressType: "ipv4"
              OriginReadTimeout: 30
              HTTPSPort: 443
              OriginKeepaliveTimeout: 5
              OriginSSLProtocols:
                - "TLSv1.2"
              HTTPPort: 80
              OriginProtocolPolicy: "https-only"
        ViewerCertificate:
          MinimumProtocolVersion: "TLSv1.2_2021"
          SslSupportMethod: "sni-only"
          CloudFrontDefaultCertificate: false
          AcmCertificateArn: !Ref AcmCertificateArn
        PriceClass: "PriceClass_All"
        DefaultCacheBehavior:
          Compress: true
          FunctionAssociations: []
          LambdaFunctionAssociations: []
          TargetOriginId: !Ref ApiDomainName
          ViewerProtocolPolicy: "redirect-to-https"
          GrpcConfig:
            Enabled: false
          TrustedSigners: []
          FieldLevelEncryptionId: ""
          TrustedKeyGroups: []
          AllowedMethods:
            - "HEAD"
            - "DELETE"
            - "POST"
            - "GET"
            - "OPTIONS"
            - "PUT"
            - "PATCH"
          CachedMethods:
            - "HEAD"
            - "GET"
          SmoothStreaming: false
          CachePolicyId:
            !FindInMap [AWSManagedPolicyIds, CachePolicy, CACHING_DISABLED]
          OriginRequestPolicyId:
            !FindInMap [
              AWSManagedPolicyIds,
              OriginRequestPolicy,
              ALL_VIEWER_EXCEPT_HOST_HEADER,
            ]
        Staging: false
        CustomErrorResponses: []
        ContinuousDeploymentPolicyId: ""
        OriginGroups:
          Quantity: 0
          Items: []
        Enabled: true
        Aliases:
          - !Ref DistributionAlias
        IPV6Enabled: true
        WebACLId: !Ref WebACLArn
        HttpVersion: "http2"
        Restrictions:
          GeoRestriction:
            Locations: []
            RestrictionType: "none"
        CacheBehaviors: []
      Tags:
        - Value: "gb-backend"
          Key: "Name"

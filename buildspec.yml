version: 0.2
env:
  variables:
    COTURN_SHARED_SECRET: /GbraverBurst/dev/coturnSharedSecret
  parameter-store:
    SERVICE: /GbraverBurst/dev/service
    WS_SIGNAL_SERVICE: /GbraverBurst/dev/wsSignalService
    STAGE: /GbraverBurst/dev/stage
    WS_API_DOMAIN_NAME: /GbraverBurst/dev/wsApiDomainName
    WS_API_CERT_ARN: /GbraverBurst/dev/wsApiCertArn
    WS_SIGNAL_DOMAIN_NAME: /GbraverBurst/dev/wsSignalDomainName
    WS_SIGNAL_CERT_ARN: /GbraverBurst/dev/wsSignalCertArn
    WEBRTC_HELPER_DOMAIN_NAME: /GbraverBurst/dev/webrtcHelperDomainName
    WEBRTC_HELPER_CERT_ARN: /GbraverBurst/dev/webrtcHelperCertArn
    WEBRTC_HELPER_CORS_ORIGIN: /GbraverBurst/dev/webrtcHelperCorsOrigin
    COGNITO_USER_POOL_ID: /GbraverBurst/dev/cognitoUserPoolId
    COGNITO_CLIENT_ID: /GbraverBurst/dev/cognitoClientId
    DOCKER_USER: /GbraverBurst/dev/dockerUser
    DOCKER_TOKEN: /GbraverBurst/dev/dockerToken
    MATCH_MAKE_ECR_REPOSITORY_NAME: /GbraverBurst/dev/matchMakeEcrRepositoryName
    VPC_SUBNET_COUNT: /GbraverBurst/dev/vpcSubnetCount
    SERVERLESS_ACCESS_KEY: /GbraverBurst/dev/serverlessAccessKey
phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - npm ci
  build:
    commands:
      - DOCKER_IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION}
      - ./deploy-serverless.bash
      - ./push-match-make-container.bash
      - ./deploy-backend-ecs.bash
      - ./deploy-ws-signal.bash

name: "Trivy Scanning - Action"

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: "30 1 * * 0"

permissions:
  contents: read
  security-events: write

jobs:
  Trivy-Scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Build an image from Dockerfile
        run: |
          npm ci
          cd ./packages/backend-app
          npm run build:match-make
          docker build -t gbraver-burst/backend-app:${{ github.sha }} -f matchMake.Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "gbraver-burst/backend-app:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  anonymous-container-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build anonymous backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/anonymous-backend-app/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: gbraver-burst/anonymous-backend-app:${{ github.sha }}
          provenance: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "gbraver-burst/anonymous-backend-app:${{ github.sha }}"
          format: "sarif"
          output: "trivy-anonymous-backend-results.sarif"
          limit-severities-for-sarif: true
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-anonymous-backend-results.sarif"
          category: anonymous-backend-app

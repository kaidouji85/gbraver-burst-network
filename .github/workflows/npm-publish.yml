name: Publish Package to npmjs
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
env:
  SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  # serverless frameworkのビルドを通すためのダミー値
  # 同フレームワークを用いているパッケージはnpm publishの対象ではないため、ダミーでも問題ない
  WS_API_DOMAIN_NAME: "dummy-value.not-used.com"
  WS_API_CERT_ARN: "arn:aws:acm:region:account:certificate/dummy-value-not-used"
  WS_SIGNAL_DOMAIN_NAME: "dummy-value.not-used.com"
  WS_SIGNAL_CERT_ARN: "arn:aws:acm:region:account:certificate/dummy-value-not-used"
  ANONYMOUS_BACKEND_CORS_ORIGIN: "test-anonymous-backend-cors-origin"
  COTURN_SHARED_SECRET: "test-coturn-shared-secret"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npx changeset publish

name: Node.js CI
on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
permissions:
  contents: read
env:
  NODE_JS_VERSION: 24.x
  SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  WS_API_DOMAIN_NAME: test-domain-name # ビルド用のダミー値
  WS_API_CERT_ARN: test-certificate-arn # ビルド用のダミー値
  WS_SIGNAL_DOMAIN_NAME: test-signal-domain-name # ビルド用のダミー値
  WS_SIGNAL_CERT_ARN: test-signal-certificate-arn # ビルド用のダミー値
  ANONYMOUS_BACKEND_CORS_ORIGIN: test-anonymous-backend-cors-origin # ビルド用のダミー値
  COTURN_SHARED_SECRET: test-coturn-shared-secret # ビルド用のダミー値
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x *.bash
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_JS_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run code-format-check
      - run: npm test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_JS_VERSION }}
      - run: npm ci
      # serverless v4 では`sls`コマンド実行時に同ツールがダウンロードされる
      # そのためturboなどで並列ビルドを行うと、ダウンロードの競合が発生してビルドに失敗することがある
      # この問題を回避するため、ビルドは並列実行せずに順次実行する
      - run: npx turbo run build --concurrency=1
      - run: npm run dependency-check
